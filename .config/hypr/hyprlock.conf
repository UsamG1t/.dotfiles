# ~/.config/hypr/hyprlock.conf

background {
    monitor =
    color = rgba(10, 10, 10, 0.95)
}

input-field {
    monitor =
    size = 260, 44
    position = 0, 0
    halign = center
    valign = center

    outline_thickness = 2
    dots_center      = true

    outer_color  = rgb(9333ea)   # фиолетовый из палитры
    inner_color  = rgb(141414)
    font_color   = rgb(e0e0e0)
    check_color  = rgb(d4a020)   # охра при проверке пароля

    placeholder_text = <span foreground="##888888">Password...</span>
    hide_input       = false
}
