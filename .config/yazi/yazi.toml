# ~/.config/yazi/yazi.toml

[mgr]
ratio          = [1, 3, 4]
sort_by        = "natural"
sort_dir_first = true
show_hidden    = false
show_symlink   = true
scrolloff      = 5

[preview]
tab_size   = 2
max_width  = 600
max_height = 900

# ── Ассоциации приложений ─────────────────────────────────────────────────────

[opener]
image = [
  { run = 'imv %s',      orphan = true, desc = "imv"     },
]
video = [
  { run = 'mpv %s',      orphan = true, desc = "mpv"     },
]
audio = [
  { run = 'mpv %s',      orphan = true, desc = "mpv"     },
]
pdf = [
  { run = 'zathura %s',  orphan = true, desc = "zathura" },
]
text = [
  { run = 'code-oss %s', orphan = true, desc = "VS Code" },
  { run = 'subl %s',     orphan = true, desc = "Sublime" },
]
fallback = [
  { run = 'xdg-open %s1', orphan = true, desc = "Open"   },
]

[open]
rules = [
  { mime = "image/*",                 use = "image"    },
  { mime = "video/*",                 use = "video"    },
  { mime = "audio/*",                 use = "audio"    },
  { mime = "application/pdf",         use = "pdf"      },
  { mime = "text/*",                  use = "text"     },
  { mime = "application/json",        use = "text"     },
  { mime = "application/xml",         use = "text"     },
  { mime = "application/javascript",  use = "text"     },
  { mime = "inode/x-empty",           use = "text"     },
  { mime = "*",                       use = "fallback" },
]

[[plugin.prepend_fetchers]]
url = "*"
run = "git"
group = "git"

[[plugin.prepend_fetchers]]
url = "*/"
run = "git"
group = "git"
