# ~/.config/yazi/yazi.toml

[manager]
ratio          = [1, 3, 4]
sort_by        = "natural"
sort_dir_first = true
show_hidden    = false
show_symlink   = true
scrolloff      = 5

[preview]
tab_size   = 2
max_width  = 600
max_height = 900

# ── Ассоциации приложений ─────────────────────────────────────────────────────

[opener]
image = [
  { run = 'imv "$@"',      desc = "imv"     },
]
video = [
  { run = 'mpv "$@"',      desc = "mpv"     },
]
audio = [
  { run = 'mpv "$@"',      desc = "mpv"     },
]
pdf = [
  { run = 'zathura "$@"',  desc = "zathura" },
]
text = [
  { run = 'code-oss "$@"', desc = "VS Code" },
  { run = 'subl "$@"',     desc = "Sublime" },
]
fallback = [
  { run = 'xdg-open "$@"', desc = "Open"   },
]

[open]
rules = [
  { mime = "image/*",                 use = "image"    },
  { mime = "video/*",                 use = "video"    },
  { mime = "audio/*",                 use = "audio"    },
  { mime = "application/pdf",         use = "pdf"      },
  { mime = "text/*",                  use = "text"     },
  { mime = "application/json",        use = "text"     },
  { mime = "application/xml",         use = "text"     },
  { mime = "application/javascript",  use = "text"     },
  { mime = "inode/x-empty",           use = "text"     },
  { mime = "*",                       use = "fallback" },
]
